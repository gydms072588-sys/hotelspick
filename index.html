<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HotelsPick 메인페이지 와이어프레임 프로토타입">
  <title>HotelsPick — 메인페이지 프로토타입</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body id="top">
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#top" aria-label="호텔스픽 홈">호텔스픽</a>
      <nav class="main-nav" aria-label="사용자 메뉴">
        <a href="#">마이페이지</a>
        <a href="#">회원가입</a>
        <button class="nav-select" type="button" aria-label="언어: 한국어">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3Z"></path></svg>
          <span>한국어</span>
          <svg class="chevron" aria-hidden="true" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"></path></svg>
        </button>
        <button class="nav-select" type="button" aria-label="통화: 원화 KRW">
          <span>₩ KRW</span>
          <svg class="chevron" aria-hidden="true" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"></path></svg>
        </button>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero" id="search" aria-label="호텔스픽 프로모션 배너">
      <div class="hero-viewport">
        <div class="hero-track" id="hero-track"></div>
      </div>
      <button class="hero-arrow prev" type="button" aria-label="이전 배너">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"></path></svg>
      </button>
      <button class="hero-arrow next" type="button" aria-label="다음 배너">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg>
      </button>
      <div class="hero-dots" id="hero-dots" aria-label="배너 슬라이드 선택"></div>
      <div class="hero-inner">
        <form class="search-bar" id="hotel-search-form">
          <label class="search-item search-place">
            <span class="search-label">여행지 검색</span>
            <input type="search" name="destination" placeholder="도시, 국가, 숙소명으로 검색" aria-label="여행지 검색">
          </label>
          <button class="search-item search-option" type="button" data-search-field="checkin">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"></path><path d="M8 13h2M14 13h2M8 17h2M14 17h2"></path></svg>
            <span>체크인</span>
          </button>
          <button class="search-item search-option" type="button" data-search-field="checkout">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"></path><path d="M8 13h2M14 13h2M8 17h2M14 17h2"></path></svg>
            <span>체크아웃</span>
          </button>
          <button class="search-item search-option" type="button" data-search-field="guests">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"></circle><path d="M5 20c.5-4 2.8-6 7-6s6.5 2 7 6Z"></path></svg>
            <span>투숙객</span>
          </button>
          <button class="search-button" type="submit">검색</button>
        </form>
      </div>
    </section>
    <section class="section deal-section" id="deals">
      <div class="container">
        <div class="section-heading">
          <h2>특가 호텔</h2>
          <a href="#">더보기</a>
        </div>
        <div class="deal-carousel">
          <button class="carousel-arrow carousel-prev" type="button" aria-label="이전 특가 호텔">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"></path></svg>
          </button>
          <div class="deal-viewport">
            <div class="deal-track" id="deal-track"></div>
          </div>
          <button class="carousel-arrow carousel-next" type="button" aria-label="다음 특가 호텔">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg>
          </button>
        </div>
      </div>
    </section>
    <section class="section destination-section" id="destinations">
      <div class="container">
        <div class="destination-explorer" id="destination-content">
          <div class="destination-left">
            <h2>HOT 여행지</h2>
            <div class="destination-sidebar">
              <div class="destination-list" id="destination-list"></div>
              <button class="destination-all-button" type="button">지역 전체 보기</button>
            </div>
          </div>
          <div class="destination-right">
            <div class="destination-tabs" role="tablist" aria-label="여행지 카테고리">
              <button class="active" type="button" role="tab" aria-selected="true" data-destination-category="domestic">국내</button>
              <button type="button" role="tab" aria-selected="false" data-destination-category="global">해외</button>
            </div>
            <article class="destination-feature" id="destination-feature" aria-live="polite">
              <span class="destination-promo-label" id="destination-promo-label"></span>
              <div class="destination-dots" id="destination-dots" aria-label="프로모션 배너 위치"></div>
              <button class="detail-button" type="button">자세히 보기</button>
            </article>
          </div>
        </div>
      </div>
    </section>
    <section class="section rated-section" id="rated">
      <div class="container">
        <header class="rated-heading">
          <h2>평점 높은숙소</h2>
          <div class="rated-tabs" role="tablist" aria-label="숙소 지역 구분">
            <button class="active" type="button" role="tab" aria-selected="true" data-rated-scope="domestic">국내</button>
            <button type="button" role="tab" aria-selected="false" data-rated-scope="overseas">해외</button>
          </div>
        </header>
        <div class="rated-categories" id="rated-categories" role="group" aria-label="숙소 지역 카테고리"></div>
        <div class="rated-grid" id="rated-grid" aria-live="polite"></div>
        <div class="more-wrap"><button class="more-button" type="button">더보기</button></div>
      </div>
    </section>
    <section class="partner-section" id="partner" aria-labelledby="partner-title">
      <div class="container partner-box">
        <h2 id="partner-title">호텔스픽 과 함께할<br>파트너를 찾고 있어요</h2>
        <a href="#">제휴 문의하기</a>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><div><a class="logo footer-logo" href="#top">HOTELS<span>PICK</span></a><p>HotelsPick Inc. · 서울특별시 강남구 테헤란로 123</p><p>© 2026 HotelsPick. All rights reserved.</p></div><div class="footer-column"><strong>서비스</strong><a href="#">서비스 소개</a><a href="#">호텔 검색</a></div><div class="footer-column"><strong>정책</strong><a href="#">이용약관</a><a href="#">개인정보처리방침</a></div><div class="footer-column"><strong>고객지원</strong><a href="#">고객센터</a><a href="#">제휴 문의</a></div></div></footer>
  <aside class="floating-menu" aria-label="빠른 메뉴">
    <nav class="floating-group" aria-label="바로가기">
      <a href="#deals">픽 호텔</a>
      <a href="#deals">이벤트</a>
      <a href="#">도움말</a>
    </nav>
    <button class="floating-chat" type="button" aria-label="챗봇 열기">
      <span class="material-symbols-outlined" aria-hidden="true">chat_bubble</span>
      <span>챗봇</span>
    </button>
    <button class="top-button" type="button">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_upward</span>
      <span>맨위로</span>
    </button>
  </aside>
</body>
</html>
